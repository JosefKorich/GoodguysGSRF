name: Verify quantitative pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify baseline outputs
        run: python verify_pipeline.py
      - name: Verify enhanced outputs
        run: python verify_enhanced_pipeline.py
